# Раздача статической сборки (dist/) внутри контейнера.
# HashRouter не требует rewrite-правил, но try_files оставлен для надёжности.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Безопасность (заголовки на всех ответах)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Хэшированные ассеты — кэш на год
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html не кэшируем — обновления видны сразу
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA-фолбэк + главная
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Служебное скрываем
    location ~ /\.(?!well-known) {
        deny all;
    }
}
