# nginx внутри контейнера web.
#  /          — статическая сборка Vite (SPA-фолбэк на index.html)
#  /api/*     — прокси на контейнер app (Node, порт 3000)
#  /uploads/* — файлы фото из общего volume (отдаются напрямую, с кэшем)
# HashRouter не требует rewrite-правил; try_files оставлен для надёжности.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка фото проходит через API (multer), лимит с запасом
    client_max_body_size 30m;

    # Сжатие
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API → app ──
    location /api/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Файлы фото — напрямую из volume (быстрее, чем проксировать) ──
    location /uploads/ {
        alias /data/uploads/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Хэшированные ассеты — кэш на год ──
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html не кэшируем — обновления видны сразу после деплоя
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── SPA-фолбэк + главная ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Служебное скрываем (кроме .well-known для ACME-проверок)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
