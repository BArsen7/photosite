<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Artem Volkov — photographer. Street, portrait, architecture, still life and landscape photography. Loving light and capturing moments."
    />
    <meta name="theme-color" content="#0f0f0f" />

    <!-- OpenGraph / Twitter: дефолты для краулеров без JS;
         на конкретных страницах их динамически обновляет usePageMeta -->
    <meta property="og:site_name" content="Artem Volkov — Photographer" />
    <meta property="og:title" content="Artem Volkov — Photographer" />
    <meta
      property="og:description"
      content="Street, портрет, архитектура, натюрморт и пейзаж. Плёнка и цифровой средний формат."
    />
    <meta
      property="og:image"
      content="https://image.qwenlm.ai/generated-images/63cfecc5-6791-4b6d-9663-2a53c23d3f09/_result.png"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Artem Volkov — Photographer</title>

    <!-- Шрифты: Playfair Display (заголовки) + Inter (текст) + JetBrains Mono (служебные подписи) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Тёмная тема до загрузки бандла — без белой вспышки */
      html,
      body {
        margin: 0;
        background-color: #0f0f0f;
        color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
