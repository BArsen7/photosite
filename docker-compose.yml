# Полный автономный стек на одноплатнике (Banana Pi M4 Zero и др. ARM64/SBC):
#   web — nginx: статика + кэшированная отдача /uploads
#   app — Node: API, SQLite, хранение фото
# Данные живут в именованном volume `portfolio-data` (БД + загрузки + секрет JWT).
#
# Запуск:
#   docker compose up -d --build
#   docker compose logs app            # посмотреть первый email/пароль админки

services:
  web:
    build:
      context: .
      target: web
    ports:
      - "80:80"
    volumes:
      - portfolio-data:/data:ro       # nginx отдаёт /uploads напрямую, без прокси
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - portfolio

  app:
    build:
      context: .
      target: app
    environment:
      # Учётные данные первого входа (см. docker compose logs app, если пароль сгенерирован)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - portfolio-data:/data
    restart: unless-stopped
    # API доступен только внутри сети compose — снаружи только через nginx
    networks:
      - portfolio

  # HTTPS: раскомментируйте, направьте A-запись домена на плату и впишите
  # домен в deploy/Caddyfile — сертификат Let's Encrypt будет выпущен сам.
  # caddy:
  #   image: caddy:2.10-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   depends_on:
  #     - web
  #   restart: unless-stopped
  #   networks:
  #     - portfolio

volumes:
  portfolio-data:
  # caddy-data:

networks:
  portfolio:
